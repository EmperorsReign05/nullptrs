controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: odometry/filtered
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    failure_tolerance: 1.0
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.3
      lookahead_dist: 0.3
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.4
      use_velocity_scaled_lookahead_dist: false
      use_collision_detection: true
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.5
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.3
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.12
      transform_tolerance: 0.5
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.2
collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 0.5
    stop_pub_timeout: 1.0
    base_shift_correction: true
    enable_stamped_cmd_vel: false
    polygons: [StopZone]
    StopZone:
      type: polygon
      points: "[[0.45, 0.25], [0.45, -0.25], [-0.15, -0.25], [-0.15, 0.25]]"
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: stop_zone
    observation_sources: [scan]
    scan:
      type: scan
      topic: scan
      enabled: true
      source_timeout: 0.5
      min_height: -0.1
      max_height: 1.0
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: wheel/odometry
    odom0_config: [false, false, false, false, false, false, true, true, false, false, false, true, false, false, false]
    imu0: imu
    imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true, true, false, false]
    imu0_remove_gravitational_acceleration: false
